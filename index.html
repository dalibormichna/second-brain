<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Second-brain-pwa</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #1a202c;
            color: #cbd5e0;
        }
        .header-bg {
            background-color: #3d4852;
        }
        .btn-primary {
            background-color: #6574cd;
            border-color: #6574cd;
        }
        .btn-primary:hover {
            background-color: #4c51bf;
            border-color: #4c51bf;
        }
    </style>
</head>
<body class="font-sans leading-normal tracking-normal text-white">

<div x-data="app" x-init="init">

<header class="header-bg shadow-md">
    <div class="container mx-auto px-6 py-3 flex justify-between items-center">
        <h1 class="text-xl font-bold">Second-brain-pwa</h1>
        <button @click="addCategoryModal = true" class="btn-primary text-white px-3 py-1 rounded-full">Přidat Kategorii</button>
    </div>
</header>

<main class="container mx-auto px-6 py-8">

    <!-- Modal pro přidání kategorie -->
    <div x-show="addCategoryModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-gray-800 p-6 rounded-lg shadow-md w-full max-w-sm">
            <h2 class="text-xl font-bold mb-4">Přidat Kategorii</h2>
            <input x-model="newCategoryName" type="text" placeholder="Název kategorie" class="w-full px-3 py-2 rounded-lg border border-gray-700 bg-gray-900 text-white mb-4">
            <button @click="addCategory" class="btn-primary text-white px-3 py-1 rounded-full">Přidat</button>
            <button @click="addCategoryModal = false" class="text-gray-300 hover:text-white px-3 py-1 rounded-full ml-2">Zrušit</button>
        </div>
    </div>

    <!-- Modal pro přidání poznámky -->
    <div x-show="addNoteModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-gray-800 p-6 rounded-lg shadow-md w-full max-w-sm">
            <h2 class="text-xl font-bold mb-4">Přidat Poznámku</h2>
            <input x-model="newNote.title" type="text" placeholder="Název poznámky" class="w-full px-3 py-2 rounded-lg border border-gray-700 bg-gray-900 text-white mb-4">
            <textarea x-model="newNote.content" placeholder="Obsah poznámky" class="w-full px-3 py-2 rounded-lg border border-gray-700 bg-gray-900 text-white mb-4 h-32"></textarea>
            <select x-model="newNote.categoryId" class="w-full px-3 py-2 rounded-lg border border-gray-700 bg-gray-900 text-white mb-4">
                <option value="" disabled selected>Vyberte kategorii</option>
                <template x-for="(category, index) in categories" :key="index">
                    <option :value="category.id">{{ category.name }}</option>
                </template>
            </select>
            <button @click="addNote" class="btn-primary text-white px-3 py-1 rounded-full">Přidat</button>
            <button @click="addNoteModal = false" class="text-gray-300 hover:text-white px-3 py-1 rounded-full ml-2">Zrušit</button>
        </div>
    </div>

    <!-- Úvodní zpráva -->
    <section class="bg-gray-800 shadow-md rounded-lg p-6 mb-6">
        <h2 class="text-xl font-bold mb-4">Dobrý den</h2>
        <p>Vítejte v aplikaci Second-brain-pwa. Zde můžete spravovat vaše kategorie a poznámky.</p>
    </section>

    <!-- Sekce kategorií -->
    <section class="bg-gray-800 shadow-md rounded-lg p-6 mb-6">
        <h2 class="text-xl font-bold mb-4">Kategorie</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <template x-for="(category, index) in categories" :key="index">
                <div class="bg-gray-700 p-4 rounded-lg shadow-sm flex items-center justify-between">
                    <p>{{ category.name }}</p>
                    <button @click="deleteCategory(category.id)" class="text-red-500 hover:text-red-600">Odstranit</button>
                </div>
            </template>
        </div>
    </section>

    <!-- Sekce poznámek -->
    <section class="bg-gray-800 shadow-md rounded-lg p-6 mb-6">
        <h2 class="text-xl font-bold mb-4">Poznámky</h2>
        <button @click="addNoteModal = true" class="btn-primary text-white px-3 py-1 rounded-full mb-4">Přidat Poznámku</button>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <template x-for="(note, index) in notes" :key="index">
                <div class="bg-gray-700 p-4 rounded-lg shadow-sm flex items-center justify-between">
                    <div>
                        <p class="font-semibold">{{ note.title }}</p>
                        <p>{{ note.content }}</p>
                        <p class="text-gray-500">Kategorie: <span x-text="getCategoryName(note.categoryId)"></span></p>
                    </div>
                    <button @click="deleteNote(note.id)" class="text-red-500 hover:text-red-600">Odstranit</button>
                </div>
            </template>
        </div>
    </section>

</main>

<footer class="bg-gray-800 text-white py-4">
    <div class="container mx-auto px-6 text-center">
        &copy; 2026 Second-brain-pwa. Všechna práva vyhrazena.
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<script>
document.addEventListener('alpine:init', () => {
    Alpine.data('app', () => ({
        addCategoryModal: false,
        addNoteModal: false,
        newCategoryName: '',
        newNote: {
            id: Date.now(),
            title: '',
            content: '',
            categoryId: ''
        },
        categories: [],
        notes: [],

        init() {
            // Načtení dat z localStorage
            this.categories = JSON.parse(localStorage.getItem('categories')) || [];
            this.notes = JSON.parse(localStorage.getItem('notes')) || [];
        },

        addCategory() {
    if (this.newCategoryName.trim()) {
        const newCategory = {
            id: Date.now(),
            name: this.newCategoryName
        };
        this.categories.push(newCategory);
        localStorage.setItem('categories', JSON.stringify(this.categories));
        this.newCategoryName = '';
        this.addCategoryModal = false;
        // Způsobíme znovu vykreslení komponenty
        this.$nextTick(() => {
            this.categories = [...this.categories];
        });
    }
}

        deleteCategory(id) {
            this.categories = this.categories.filter(category => category.id !== id);
            this.notes = this.notes.filter(note => note.categoryId !== id);
            localStorage.setItem('categories', JSON.stringify(this.categories));
            localStorage.setItem('notes', JSON.stringify(this.notes));
        },

        addNote() {
            if (this.newNote.title.trim() && this.newNote.content.trim() && this.newNote.categoryId) {
                const newNote = {
                    id: Date.now(),
                    title: this.newNote.title,
                    content: this.newNote.content,
                    categoryId: parseInt(this.newNote.categoryId)
                };
                this.notes.push(newNote);
                localStorage.setItem('notes', JSON.stringify(this.notes));
                this.newNote = {
                    id: Date.now(),
                    title: '',
                    content: '',
                    categoryId: ''
                };
                this.addNoteModal = false;
            }
        },

        deleteNote(id) {
            this.notes = this.notes.filter(note => note.id !== id);
            localStorage.setItem('notes', JSON.stringify(this.notes));
        },

        getCategoryName(categoryId) {
            const category = this.categories.find(category => category.id === categoryId);
            return category ? category.name : 'Nedefinováno';
        }
    }));
});
</script>

</body>
</html>
